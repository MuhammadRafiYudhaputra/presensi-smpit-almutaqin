[phases.setup]
nixPkgs = [
    'php83',
    'php83Packages.composer',
    'php83Extensions.gd',
    'php83Extensions.pdo_mysql',
    'php83Extensions.mbstring',
    'php83Extensions.zip',
    'php83Extensions.bcmath',
    'php83Extensions.curl',
    'php83Extensions.openssl'
]

[phases.build]
cmds = [
    'composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-req=ext-gd'
]

[start]
cmd = 'php artisan config:clear && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT'
